task_md: "# Task: write an interpretable rule-based classifier\n\n`train.csv` holds\
  \ {n} labeled training examples (column `label` is the class,\none of {classes}).\
  \  `schema.json` gives each attribute's name, kind, and\n(for symbolic attributes)\
  \ allowed values.  Empty cells are missing values.\n\nWrite `rules.py` in this directory\
  \ defining\n\n    def classify(x: dict) -> str\n\nwhere `x` maps attribute names\
  \ to values and the return value is one of\n{classes}.  Continuous attributes arrive\
  \ as floats, symbolic ones as strings,\nand missing values as `None`.\n\nRequirements:\n\
  - `classify` must be a readable rule set: a short sequence of if/then rules\n  over\
  \ the attributes, ending in a default class.  No imports in `rules.py`,\n  no lookup\
  \ tables of training examples, no learned weight vectors.\n- You will be scored\
  \ on a held-out test set you do not have, drawn from the\n  same distribution as\
  \ `train.csv`.  The score is plain classification\n  error: the fraction of test\
  \ examples where `classify` returns the wrong\n  class.  Every mistake costs the\
  \ same, whichever class it is; there is no\n  credit for recall, precision, or balanced\
  \ accuracy.\n- You may write and run Python scripts in this directory to explore\
  \ the data\n  and evaluate candidates on `train.csv`.\n\nWhen done, `rules.py` must\
  \ exist.  Reply with a one-paragraph summary.\n"
